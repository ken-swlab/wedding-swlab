# 依存関係の更新（Dependabot）
#
# ★npm は「脆弱性の修正」だけを PR にする（open-pull-requests-limit: 0）★
#   通常のバージョン更新まで出すと、Next.js 16 のように API が大きく変わる更新が
#   毎週届き、main へのマージ（= 本番デプロイ）の判断が重くなる。
#   脆弱性の修正 PR はこの上限とは別枠で作られる。
#   リポジトリの Settings → Code security で「Dependabot security updates」を有効にしておくこと。
# ★GitHub Actions は通常の更新も出す★ ワークフローは SHA で固定しているので、
#   Dependabot が SHA とコメントのバージョンをまとめて更新する。
version: 2
updates:
  - package-ecosystem: npm
    directory: /app/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 0
    # ★firebase-admin のメジャー更新は自動で出さない（Issue #38）★
    #   14 系は jwks-rsa 4 → ESM 専用の jose 6 を require() する。Vercel の関数ではこれが
    #   ERR_REQUIRE_ESM で落ち、firebase-admin を使う API（ログイン・アップロードなど）がすべて 500 になった。
    #   Vercel 上で動くことを確かめてから、手で上げる。
    #   ただし脆弱性修正の PR では、この ignore があっても #40 で 14 系に上がり、再び 500 になった（PR #58）。
    #   依存を変える PR では deps-runtime ワークフロー（Issue #59）が古い Node で require() を試すので、
    #   そのチェックが赤い Dependabot の PR はマージしない。
    ignore:
      - dependency-name: firebase-admin
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /infra/workers/exif-stripper
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies]
