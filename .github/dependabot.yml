# 依存関係の更新（Dependabot）
#
# ★npm は「脆弱性の修正」だけを PR にする（open-pull-requests-limit: 0）★
#   通常のバージョン更新まで出すと、Next.js 16 のように API が大きく変わる更新が
#   毎週届き、main へのマージ（= 本番デプロイ）の判断が重くなる。
#   脆弱性の修正 PR はこの上限とは別枠で作られる。
#   リポジトリの Settings → Code security で「Dependabot security updates」を有効にしておくこと。
# ★GitHub Actions は通常の更新も出す★ ワークフローは SHA で固定しているので、
#   Dependabot が SHA とコメントのバージョンをまとめて更新する。
version: 2
updates:
  - package-ecosystem: npm
    directory: /app/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /infra/workers/exif-stripper
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: [dependencies]
